services:
  frontend:
    build:
      context: ..
      dockerfile: build/go/frontend/Dockerfile
    command: strelka-frontend -locallog=true -kafkalog=true
    environment:
      KAFKA_BOOTSTRAP: 192.168.100.84:29092
      RAW_TOPIC: raw
      ANALYSIS_TOPIC: analysis
    ports:
      - 57314:57314
    networks:
      - discover_net
    volumes:
      - ../configs/go/frontend/:/etc/strelka/:ro
      - logs:/var/log/strelka/
    restart: unless-stopped
    depends_on:
      - coordinator


  # ============================
  # Backend workers
  # ============================
  backend:
    build:
      context: ..
      dockerfile: build/python/backend/Dockerfile
    command: ["supervisord", "-c", "/etc/strelka/supervisord.conf"]
    shm_size: 1gb
    networks:
      - discover_net
    volumes:
      - ../configs/python/backend/:/etc/strelka/:ro
      # ScanClamav talks to the clamd sidecar over TCP (clamd:3310) on the
      # internal docker network. No shared filesystem needed.
    restart: unless-stopped
    depends_on:
      - coordinator
      - clamd
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '4.0'
          memory: 8g
        reservations:
          cpus: '3.5'
          memory: 4g

  clamd:
    image: clamav/clamav:1.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - CLAMAV_NO_CLAMD=false
      - CLAMAV_NO_FRESHCLAMD=false
    volumes:
      - clamd_db:/var/lib/clamav/
      - ../configs/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - discover_net
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          cpus: '1.0'
          memory: 1500m


  # ============================
  # Manager (Redis task cleanup)
  # ============================
  manager:
    build:
      context: ..
      dockerfile: build/go/manager/Dockerfile
    command: strelka-manager
    restart: unless-stopped
    networks:
      - discover_net
    volumes:
      - ../configs/go/manager/:/etc/strelka/:ro
    depends_on:
      - coordinator


  # ============================
  # Redis (Coordinator)
  # ============================
  coordinator:
    image: redis:alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    networks:
      - discover_net


  # ============================
  # Gatekeeper Redis
  # ============================
  gatekeeper:
    image: redis:alpine
    command: redis-server --save "" --appendonly no --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - discover_net


  # ============================
  # Jaeger tracing
  # ============================
  jaeger:
    image: jaegertracing/all-in-one:1.42
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - discover_net
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"


  # ============================
  # UI + DB
  # ============================
  ui:
    image: target/strelka-ui:latest
    restart: unless-stopped
    environment:
      - DATABASE_HOST=postgresdb
      - DATABASE_NAME=strelka_ui
      - DATABASE_PASSWORD=postgres
      - DATABASE_USERNAME=postgres
      - STRELKA_HOST=frontend
    networks:
      - discover_net
    ports:
      - "9980:8080"
    depends_on:
      - postgresdb

  postgresdb:
    image: postgres:15.14
    restart: unless-stopped
    environment:
      - POSTGRES_DB=strelka_ui
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USERNAME=postgres
    networks:
      - discover_net
    ports:
      - "5432:5432"

networks:
  discover_net:
    external: true
    name: discover_engine_pipeline_net  # REPLACE with actual network name from 'docker network ls'

volumes:
  logs:
  clamd_db:

TCPSocket 3310
TCPAddr 0.0.0.0


LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes


LogTime yes
LogClean no
LogVerbose no
LogFileMaxSize 10M


PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav

User clamav


SelfCheck 600


MaxScanSize 100M
MaxFileSize 25M
MaxRecursion 16
MaxFiles 10000
StreamMaxLength 100M

ScanArchive yes
ScanMail yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanPE yes
ScanELF yes
ScanSWF yes

# Concurrency. The host has 16 vCPU; clamd is shared by all 16 workers.
MaxThreads 12
MaxConnectionQueueLength 64
ReadTimeout 60
CommandReadTimeout 30
SendBufTimeout 200
MaxQueue 100
IdleTimeout 30
